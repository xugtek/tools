<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XugTek 工具站</title>
  <meta name="description" content="XugTek 工具站：轻量、快速、关注 SEO 与隐私的在线工具集合。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="index.html" data-i18n="siteName">XugTek 工具站</a>
      <div class="header-actions">
        <button type="button" class="icon-button" data-theme-toggle data-i18n-title="themeToggle" data-i18n-aria-label="themeToggle" title="切换主题" aria-label="切换主题">🌓</button>
        <button type="button" class="icon-button" data-i18n-switch>EN</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1 data-i18n="heroTitle">实用在线工具</h1>
        <p data-i18n="heroSubtitle">轻量、快速、关注 SEO 与隐私的在线工具集合</p>
      </section>

      <section class="tool-grid" aria-label="Tools">
        <a class="tool-card" href="token.html">
          <h3 data-i18n="tokenToolName">Token 用量费用计算器</h3>
          <p data-i18n="tokenToolDesc">估算每日/每月 Token 费用，比较人民币与美元价格</p>
          <span class="hint" data-i18n="openTool">打开工具</span>
        </a>
      </section>

      <section class="coming-soon" data-i18n="comingSoon">更多工具即将上线</section>
    </main>
  </div>

  <script type="module" src="assets/js/index-app.js"></script>
</body>
</html>
