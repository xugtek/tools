<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token费用计算器 - xugtek</title>
  <meta name="description" content="估算每日和每月 Token API 费用，支持人民币/美元双货币、缓存命中与用量估算。">
  <link rel="icon" href="assets/icons/brand.svg" type="image/svg+xml">
  <link rel="canonical" href="https://tools.xugtek.com/token.html">
  <link rel="alternate" hreflang="zh-CN" href="https://tools.xugtek.com/token.html">
  <link rel="alternate" hreflang="en" href="https://tools.xugtek.com/token.html">
  <link rel="alternate" hreflang="x-default" href="https://tools.xugtek.com/token.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="nav" aria-label="Tools">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" role="img" aria-label="xugtek"></span>
        <span data-i18n="siteName">xugtek</span>
      </a>
      <div class="nav-links">
        <a href="index.html" data-i18n="backHome">返回首页</a>
        <div class="lang-switch">
          <button type="button" class="lang-switch-btn" data-lang-toggle aria-haspopup="listbox" aria-label="Language / 语言" title="Language / 语言">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </button>
          <ul class="lang-switch-list" role="listbox" aria-label="Language / 语言">
            <li><a data-lang="zh-CN" class="current" href="#">简体中文</a></li>
            <li><a data-lang="en" href="#">English</a></li>
          </ul>
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle data-i18n-title="themeToggle" data-i18n-aria-label="themeToggle" title="切换主题" aria-label="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="container">
        <h1 data-i18n="pageTitle">Token费用计算器</h1>
      </div>
    </section>

    <div class="container">
      <section class="card" aria-labelledby="model-section-title">
        <h2 id="model-section-title" class="section-title" data-i18n="modelLabel">模型</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="model-select" data-i18n="providerLabel">提供商</label>
            <select id="model-select" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="model-name" data-i18n="modelNameLabel">模型</label>
            <input id="model-name" class="form-control" type="text" maxlength="50" data-i18n-placeholder="modelNamePlaceholder">
          </div>
        </div>
      </section>

      <section class="card" id="price-section" aria-labelledby="price-section-title">
        <h2 id="price-section-title" class="section-title" data-i18n="priceSection">价格设置（每 M Tokens）</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="price-input" data-i18n="inputPriceLabel">普通输入价</label>
            <input id="price-input" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*">
          </div>
          <div class="form-group">
            <label for="price-cached" data-i18n="cachedInputPriceLabel">缓存输入价</label>
            <input id="price-cached" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*">
          </div>
          <div class="form-group">
            <label for="price-output" data-i18n="outputPriceLabel">输出价</label>
            <input id="price-output" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*">
          </div>
          <div class="form-group">
            <label for="currency-select" data-i18n="currencyLabel">计价币种</label>
            <select id="currency-select" class="form-control">
              <option value="USD">USD</option>
              <option value="CNY">CNY</option>
            </select>
          </div>
          <div class="form-group">
            <label for="exchange-rate" data-i18n="exchangeRateLabel">汇率（1 USD = ? CNY）</label>
            <input id="exchange-rate" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" value="7.2">
          </div>
        </div>
        <p class="note" data-i18n="modelSourceNote">价格仅供参考，请以官方最新价格为准。</p>
      </section>

      <section class="card" aria-labelledby="usage-section-title">
        <h2 id="usage-section-title" class="section-title" data-i18n="usageSection">每日用量（M Tokens）</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="daily-input" data-i18n="dailyInputLabel">输入</label>
            <input id="daily-input" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*">
          </div>
          <div class="form-group">
            <label for="daily-cached" data-i18n="dailyCachedLabel">缓存命中</label>
            <input id="daily-cached" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*">
          </div>
          <div class="form-group">
            <label for="daily-output" data-i18n="dailyOutputLabel">输出</label>
            <input id="daily-output" class="form-control" type="text" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*">
          </div>
        </div>
      </section>

      <section class="card" id="estimate-section" aria-labelledby="estimate-section-title" hidden>
        <h2 id="estimate-section-title" class="section-title" data-i18n="estimateSection">估算设置</h2>
        <div class="form-grid">
          <div class="form-group form-group-month">
            <label for="month-days" data-i18n="daysPerMonthLabel">每月天数</label>
            <input id="month-days" class="form-control" type="text" inputmode="numeric" pattern="[0-9]*" value="30">
          </div>
          <div class="form-group" id="cache-estimate-control">
            <label for="cache-rate" data-i18n="cacheHitRateLabel">缓存命中率</label>
            <div class="range-row">
              <input id="cache-rate-range" class="range-slider" type="range" min="0" max="100" step="1" value="90">
              <input id="cache-rate" class="form-control range-value" type="text" inputmode="numeric" pattern="[0-9]*" value="90">
              <span>%</span>
            </div>
          </div>
          <div class="form-group" id="output-estimate-control">
            <label for="output-ratio" data-i18n="outputRatioLabel">输出 / 输入比例</label>
            <div class="range-row">
              <input id="output-ratio-range" class="range-slider" type="range" min="0" max="100" step="1" value="5">
              <input id="output-ratio" class="form-control range-value" type="text" inputmode="numeric" pattern="[0-9]*" value="5">
              <span>%</span>
            </div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="result-section-title">
        <h2 id="result-section-title" class="section-title" data-i18n="resultSection">费用结果</h2>
        <div class="result-grid">
          <div class="result-item">
            <div class="label" data-i18n="dailyCostLabel">每日费用</div>
            <div class="value">
              <span id="result-daily-cny">¥0.00</span><span class="value-sep"> / </span><span id="result-daily-usd">$0.00</span>
            </div>
          </div>
          <div class="result-item">
            <div class="label" data-i18n="monthlyCostLabel">每月费用</div>
            <div class="value">
              <span id="result-monthly-cny">¥0.00</span><span class="value-sep"> / </span><span id="result-monthly-usd">$0.00</span>
            </div>
          </div>
        </div>

        <h3 class="section-title" style="margin-top:20px" data-i18n="breakdownLabel">费用明细</h3>
        <table class="breakdown-table">
          <tbody>
            <tr>
              <td data-i18n="normalInputLabel">普通输入</td>
              <td class="usage" id="usage-normal">0 M</td>
              <td class="cost"><span id="breakdown-normal-cny">¥0.00</span><span class="cost-sep"> / </span><span id="breakdown-normal-usd">$0.00</span></td>
            </tr>
            <tr>
              <td data-i18n="cachedInputLabel">缓存命中</td>
              <td class="usage" id="usage-cached">0 M</td>
              <td class="cost"><span id="breakdown-cached-cny">¥0.00</span><span class="cost-sep"> / </span><span id="breakdown-cached-usd">$0.00</span></td>
            </tr>
            <tr>
              <td data-i18n="outputLabel">输出</td>
              <td class="usage" id="usage-output">0 M</td>
              <td class="cost"><span id="breakdown-output-cny">¥0.00</span><span class="cost-sep"> / </span><span id="breakdown-output-usd">$0.00</span></td>
            </tr>
          </tbody>
        </table>

        <div class="result-actions">
          <button type="button" id="btn-pin-compare" class="btn btn-secondary" data-i18n="pinToCompare">固定到对比</button>
        </div>
      </section>

      <section class="card" id="compare-section" hidden aria-labelledby="compare-title">
        <div class="compare-header">
          <h2 id="compare-title" class="section-title" data-i18n="compareSection">对比</h2>
          <button type="button" id="btn-clear-compare" class="btn btn-ghost" data-i18n="clearAll">全部清除</button>
        </div>
        <div class="compare-grid" id="compare-grid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© <span id="year"></span> xugtek</span>
      <div class="links">
        <a href="index.html" data-i18n="backHome">返回首页</a>
      </div>
    </div>
  </footer>

  <script type="module" src="assets/js/token-calc-app.js"></script>
</body>
</html>
