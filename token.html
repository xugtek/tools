<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token 用量费用计算器 - XugTek 工具站</title>
  <meta name="description" content="估算每日和每月 Token API 费用，支持人民币/美元双货币、缓存命中与用量估算。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="index.html" data-i18n="siteName">XugTek 工具站</a>
      <div class="header-actions">
        <button type="button" class="icon-button" data-theme-toggle data-i18n-title="themeToggle" data-i18n-aria-label="themeToggle" title="切换主题" aria-label="切换主题">🌓</button>
        <button type="button" class="icon-button" data-i18n-switch>EN</button>
      </div>
    </header>

    <main>
      <h1 data-i18n="pageTitle">Token 用量费用计算器</h1>

      <section class="card" aria-labelledby="model-section-title">
        <h2 id="model-section-title" class="section-title" data-i18n="modelLabel">模型</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="model-select" data-i18n="modelLabel">模型</label>
            <select id="model-select" class="form-control"></select>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="price-section-title">
        <h2 id="price-section-title" class="section-title" data-i18n="priceSection">价格设置（每 1M Tokens）</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="price-input" data-i18n="inputPriceLabel">普通输入价</label>
            <input id="price-input" class="form-control" type="number" min="0" step="0.0001" inputmode="decimal">
          </div>
          <div class="form-group">
            <label for="price-cached" data-i18n="cachedInputPriceLabel">缓存输入价</label>
            <input id="price-cached" class="form-control" type="number" min="0" step="0.0001" inputmode="decimal">
          </div>
          <div class="form-group">
            <label for="price-output" data-i18n="outputPriceLabel">输出价</label>
            <input id="price-output" class="form-control" type="number" min="0" step="0.0001" inputmode="decimal">
          </div>
          <div class="form-group">
            <label for="currency-select" data-i18n="currencyLabel">计价币种</label>
            <select id="currency-select" class="form-control">
              <option value="USD">USD</option>
              <option value="CNY">CNY</option>
            </select>
          </div>
        </div>
        <p class="note" data-i18n="modelSourceNote">价格来自 token_models.json，可编辑；显示结果仅供参考。</p>
      </section>

      <section class="card" aria-labelledby="usage-section-title">
        <h2 id="usage-section-title" class="section-title" data-i18n="usageSection">每日用量</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="daily-input" data-i18n="dailyInputLabel">每日输入 Tokens（总）</label>
            <input id="daily-input" class="form-control" type="number" min="0" step="1" inputmode="numeric" placeholder="1000000">
          </div>
          <div class="form-group">
            <label for="daily-cached" data-i18n="dailyCachedLabel">其中缓存命中 Tokens（可留空）</label>
            <input id="daily-cached" class="form-control" type="number" min="0" step="1" inputmode="numeric" placeholder="300000">
          </div>
          <div class="form-group">
            <label for="daily-output" data-i18n="dailyOutputLabel">每日输出 Tokens（可留空）</label>
            <input id="daily-output" class="form-control" type="number" min="0" step="1" inputmode="numeric" placeholder="200000">
          </div>
        </div>
        <p class="hint" data-i18n="estimatedHint">留空的缓存/输出将按估算比例自动计算</p>
      </section>

      <section class="card" aria-labelledby="estimate-section-title">
        <h2 id="estimate-section-title" class="section-title" data-i18n="estimateSection">自动估算设置</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="cache-rate" data-i18n="cacheHitRateLabel">缓存命中率</label>
            <div style="display:flex;align-items:center;gap:8px">
              <input id="cache-rate" class="form-control" type="number" min="0" max="100" step="1" inputmode="numeric" value="30">
              <span>%</span>
            </div>
          </div>
          <div class="form-group">
            <label for="output-ratio" data-i18n="outputRatioLabel">输出 / 输入比例</label>
            <div style="display:flex;align-items:center;gap:8px">
              <input id="output-ratio" class="form-control" type="number" min="0" max="1000" step="1" inputmode="numeric" value="20">
              <span>%</span>
            </div>
          </div>
          <div class="form-group">
            <label for="exchange-rate" data-i18n="exchangeRateLabel">汇率（1 USD = ? CNY）</label>
            <input id="exchange-rate" class="form-control" type="number" min="0" step="0.0001" inputmode="decimal" value="7.2">
          </div>
        </div>
        <p class="hint" data-i18n="monthDaysHint">按 30 天/月计算</p>
      </section>

      <section class="card" aria-labelledby="result-section-title">
        <h2 id="result-section-title" class="section-title" data-i18n="resultSection">费用结果</h2>
        <div class="result-grid">
          <div class="result-item">
            <div class="label" data-i18n="dailyCostLabel">每日费用</div>
            <div class="value" id="result-daily-cny">¥0.00</div>
            <div class="sub-value" id="result-daily-usd">$0.00</div>
          </div>
          <div class="result-item result-total">
            <div class="label" data-i18n="monthlyCostLabel">每月费用（30 天）</div>
            <div class="value" id="result-monthly-cny">¥0.00</div>
            <div class="sub-value" id="result-monthly-usd">$0.00</div>
          </div>
        </div>

        <h3 class="section-title" style="margin-top:20px" data-i18n="breakdownLabel">费用构成</h3>
        <ul class="breakdown-list">
          <li>
            <span data-i18n="normalInputCostLabel">普通输入</span>
            <span><span id="breakdown-normal-cny">¥0.00</span> / <span id="breakdown-normal-usd">$0.00</span></span>
          </li>
          <li>
            <span data-i18n="cachedInputCostLabel">缓存输入</span>
            <span><span id="breakdown-cached-cny">¥0.00</span> / <span id="breakdown-cached-usd">$0.00</span></span>
          </li>
          <li>
            <span data-i18n="outputCostLabel">输出</span>
            <span><span id="breakdown-output-cny">¥0.00</span> / <span id="breakdown-output-usd">$0.00</span></span>
          </li>
        </ul>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/token-calc-app.js"></script>
</body>
</html>
